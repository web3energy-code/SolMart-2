<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>SolMart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --s1:#09090B; --s2:#0F0F12; --line:#1A1A1F; --line2:#26262C;
  --text:#F5F6F8; --mute:#8D8E99; --acc:#FF7A1A; --acc-h:#FF9038; --acc-t:#FFA85C; --acc2:#FFD166; --on:#170C02;
  --ok:#4ADE9B; --warn:#F5C04B; --bad:#F0676B;
  --grad:linear-gradient(135deg,#FF7A1A,#FF9F4A 55%,#FFC060);
  --glow:0 0 0 1px rgba(255,122,26,.18),0 8px 28px -6px rgba(255,122,26,.35);
  --shadow:0 14px 36px -12px rgba(0,0,0,.8);
  --shadow-lg:0 28px 70px -18px rgba(0,0,0,.9);
  --disp:'Sora',var(--mono),sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tint-ok-bg:#0e1f18; --tint-ok-border:#1d5a40; --tint-ok-text:#bfe9d4;
  --tint-warn-bg:#1e1810; --tint-warn-border:#5b4820;
  --tint-acc-bg:#1c1208; --tint-acc-border:#5a3413;
  --sec-hover:#242428; --bad-border:#4a2a2d; --placeholder:#5f5f68; --desc-text:#cfcfd6;
  --nav-bg:rgba(11,11,12,.88); --nav-bg2:rgba(20,20,22,.96);
}
html[data-theme="light"]{
  --bg:#F6F6F4; --s1:#FFFFFF; --s2:#F1F1EF; --line:#E6E5E1; --line2:#D7D6D1;
  --text:#15161A; --mute:#6D6E76; --acc-t:#C4590A;
  --grad:linear-gradient(135deg,#FF7A1A,#FF8E38 55%,#FFA347);
  --glow:0 0 0 1px rgba(255,122,26,.16),0 10px 26px -8px rgba(255,122,26,.3);
  --shadow:0 10px 26px -16px rgba(20,20,25,.18);
  --shadow-lg:0 22px 48px -20px rgba(20,20,25,.22);
  --tint-ok-bg:#E6F8EF; --tint-ok-border:#B7E7CC; --tint-ok-text:#0E7A49;
  --tint-warn-bg:#FDF1DC; --tint-warn-border:#F0D49C;
  --tint-acc-bg:#FFEEE0; --tint-acc-border:#FFD2AC;
  --sec-hover:#EAEAE6; --bad-border:#F3C9CB; --placeholder:#9A9AA0; --desc-text:#44454C;
  --nav-bg:rgba(255,255,255,.82); --nav-bg2:rgba(255,255,255,.92);
}
html[data-theme="light"] .logo svg{filter:drop-shadow(0 4px 14px rgba(255,122,26,.3))}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(70px + env(safe-area-inset-bottom));min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(720px 420px at 14% -6%,rgba(255,122,26,.14),transparent 60%),
    radial-gradient(640px 500px at 100% 8%,rgba(255,190,90,.08),transparent 55%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/></svg>")}
html[data-theme="light"] body{background-color:var(--bg) !important}
html[data-theme="dark"] body{background-color:var(--bg) !important}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
svg{display:block}
[hidden]{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em;font-family:var(--disp)}
.logo svg{filter:drop-shadow(0 4px 14px rgba(255,122,26,.45))}
.tabs{display:none;gap:2px;margin-left:10px}
.tabs button{position:relative;padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:600}
.tabs button:hover{color:var(--text)}
.tabs button[aria-current="page"]{color:var(--text);background:var(--s2)}
#wallet{margin-left:8px;display:flex;gap:8px;align-items:center}
.themebtn{position:relative;margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--s1);display:grid;place-items:center;color:var(--mute);transition:border-color .15s,color .15s;flex:0 0 auto}
.themebtn:hover{border-color:var(--line2);color:var(--text)}
.themebtn svg{width:19px;height:19px}
.cartbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--grad);color:var(--on);font-size:10.5px;font-weight:800;border-radius:9px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}

/* Floating cart button */
.fabrail{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;align-items:center;gap:14px}
.fab{position:relative;border-radius:50%;border:1px solid var(--line2);background:var(--s1);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-lg);transition:border-color .15s,transform .15s,background .15s}
.fab:hover{border-color:var(--acc);transform:translateY(-2px)}
.fab:active{transform:translateY(0) scale(.96)}
.fab-cart{width:48px;height:48px;background:var(--grad);color:var(--on);border-color:transparent}
.fab-cart svg{width:21px;height:21px}
@media(min-width:760px){.fabrail{bottom:28px}}
.wchip{display:flex;align-items:center;gap:7px;background:var(--s1);border:1px solid var(--line2);border-radius:999px;padding:0 12px;height:36px;white-space:nowrap;flex:0 0 auto;transition:border-color .15s,box-shadow .15s}
.wchip:hover{border-color:rgba(255,122,26,.4);box-shadow:0 0 0 1px rgba(255,122,26,.12)}
.wchip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.wchip .bal{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.badge{min-width:17px;height:17px;padding:0 4px;background:var(--grad);color:var(--on);font-size:10.5px;font-weight:800;border-radius:9px;display:inline-grid;place-items:center;margin-left:6px;box-shadow:0 0 0 1px rgba(255,122,26,.3)}
.bottom .badge{position:absolute;top:5px;left:calc(50% + 6px);margin:0}

/* Buttons and inputs */
.btn{min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--grad);color:var(--on);box-shadow:var(--glow);transition:transform .15s,box-shadow .15s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,122,26,.25),0 14px 34px -8px rgba(255,122,26,.5)}
.btn:active{transform:translateY(0)}
.btn.sec{background:var(--s2);border:1px solid var(--line2);color:var(--text);font-weight:600}
.btn.sec:hover{background:var(--sec-hover)}
.btn.bad{background:transparent;border:1px solid var(--bad-border);color:var(--bad);font-weight:600}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--acc)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 40px}
.pt{font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:4px}

/* Home */
.hero{padding-top:6px}
.hero h1{font-family:var(--disp);font-size:clamp(28px,5.6vw,44px);line-height:1.1;letter-spacing:-.03em;font-weight:700;max-width:18ch;background:linear-gradient(100deg,var(--text) 20%,var(--acc-t) 65%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.trustrow{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;color:var(--text);font-size:12.5px;font-weight:600}
.trustrow li{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);padding:7px 12px 7px 8px;border-radius:999px}
.trustrow svg{color:var(--acc-t);flex:0 0 auto}
.search{position:relative;margin-top:18px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding:14px 14px 14px 44px;border-radius:12px}
.tiles{display:flex;gap:10px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;min-width:98px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;font-weight:600;font-size:13px;line-height:1.25;text-align:center;color:var(--text);transition:border-color .15s,transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.tile svg{padding:10px;box-sizing:content-box;background:var(--s2);border-radius:50%;transition:background .15s,color .15s}
.tile svg{color:var(--acc-t)}
@media(hover:hover){.tile:hover{border-color:var(--line2)}}
.tile[aria-pressed="true"]{border-color:var(--acc);background:var(--tint-acc-bg);box-shadow:var(--glow)}
.tile[aria-pressed="true"] svg{background:var(--grad);color:var(--on)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:26px}
.head h2{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.01em}
.head select{padding:9px 8px;font-size:14px}
.count{color:var(--mute);font-size:13px;margin-top:6px}
.count button{color:var(--acc-t);text-decoration:underline;text-underline-offset:3px;margin-left:8px;font-size:13px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.cw{position:relative}
.card{position:relative;width:100%;height:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s;box-shadow:var(--shadow)}
.card::after{content:"";position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(140deg,rgba(255,122,26,0),rgba(255,122,26,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .18s;pointer-events:none}
@media(hover:hover){.card:hover{border-color:var(--line2)}}
.art,.thumb,.cover{position:relative;overflow:hidden;background:var(--s2)}
.art svg.cv,.art img{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.card:hover .art svg.cv,.card:hover .art img{transform:scale(1.06)}}
.art{aspect-ratio:1/1;position:relative}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}.card:hover::after{opacity:1}}
.art svg.cv,.art img,.thumb svg.cv,.thumb img,.cover svg.cv,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.glyph{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;pointer-events:none;background:rgba(8,9,11,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px -6px rgba(0,0,0,.5)}
.glyph svg{width:18px;height:18px;filter:none}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:1}
.tg{background:rgba(11,11,12,.85);border:1px solid var(--line2);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(11,11,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;z-index:2;border:1px solid rgba(255,255,255,.14)}
.fav svg{width:18px;height:18px}
.fav.on{color:var(--acc)}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cc{font-size:12px;color:var(--mute)}
.card h3{font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.cs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);min-width:0}
.cs .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:18px;height:18px;border-radius:50%;flex:0 0 auto}
.ck{width:14px;height:14px;flex:0 0 auto}
.pr{margin-top:auto;padding-top:6px;font-weight:800;font-size:17.5px;font-variant-numeric:tabular-nums;color:var(--acc-t);text-shadow:0 0 18px rgba(255,168,92,.25)}
.pe{font-size:12.5px;color:var(--mute)}
.pe.free{color:var(--ok)}
.empty{grid-column:1/-1;padding:30px 22px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;color:var(--mute);box-shadow:var(--shadow);position:relative;overflow:hidden}
.empty::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad)}
.empty b{display:block;font-family:var(--disp);color:var(--text);font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.empty .btn{margin-top:14px}

/* Panels and forms */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;max-width:640px;box-shadow:var(--shadow)}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-top:18px;max-width:640px}
.callout span{color:var(--mute);font-size:14px}
.sprow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sprow span.hint{display:block;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--mute)}
.hint b{color:var(--text);font-weight:600}
.pricebox{position:relative}
.pricebox span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.pricebox input{padding-left:28px}
.drop{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border:1px dashed var(--line2);border-radius:12px;color:var(--mute);cursor:pointer;overflow:hidden;background:var(--bg);text-align:center;padding:12px}
.thumbrow{display:flex;flex-wrap:wrap;gap:10px}
.pthumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}
.drop.sm{width:84px;height:84px;min-height:0;flex-direction:column;gap:4px;padding:4px;font-size:11px}
.drop.sm svg{width:20px;height:20px}
.drop:hover{border-color:var(--acc)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-bottom:12px}

/* Login */
.auth{max-width:420px;margin:8px auto 0;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow-lg)}
.auth .logo{justify-content:center;margin-bottom:14px}
.auth h1{font-family:var(--disp);font-size:25px;text-align:center;letter-spacing:-.02em}
.auth .sub{text-align:center;margin-bottom:20px}
.auth .btn.sec{width:100%;margin-bottom:10px}
.divider{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.keep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px;font-size:14px}
.keep label{display:flex;align-items:center;gap:8px}
.link{color:var(--acc-t);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.link.bad{color:var(--bad);text-decoration:none;padding:6px}
.qty{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.qty button{width:20px;height:20px;font-size:16px;font-weight:700;line-height:1;color:var(--text)}
.qty b{font-size:13px;min-width:14px;text-align:center}
.refcode{margin-top:12px;background:var(--s2);border:1px dashed var(--line2);border-radius:10px;padding:12px;text-align:center;font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--acc-t)}
.searchrow{display:flex;gap:10px;align-items:stretch;margin-top:18px}
.searchrow .search{flex:1;margin:0}
.filtbtn{position:relative;flex:0 0 auto;width:48px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);color:var(--text);display:grid;place-items:center}
.ckrow{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:10px}
.switch{text-align:center;margin-top:16px;color:var(--mute);font-size:14px}
.switch .link{font-weight:600}
.fine{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:center}

/* Profile and lists */
.pcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px;max-width:760px}
.pcard .av{width:52px;height:52px}
.pcard .who{flex:1;min-width:160px}
.pcard .who b{display:block;font-size:17px}
.pcard .who span{color:var(--mute);font-size:13px}
.pbal{text-align:right}
.pbal span{display:block;color:var(--mute);font-size:13px}
.pbal b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--acc-t)}
.pbtn{display:flex;gap:10px;margin-top:12px;max-width:760px}
.pbtn .btn{flex:1}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg.top{margin-top:18px}
.seg.wrap{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg.wrap::-webkit-scrollbar{display:none}
.seg.wrap button{white-space:nowrap;flex:0 0 auto}
.seg button{padding:8px 16px;border-radius:8px;color:var(--mute);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--on)}
.seg.full{display:flex}.seg.full button{flex:1}
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.list .empty{grid-column:auto}
.row{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;text-align:left;transition:border-color .15s}
.row:has(.rowmain:hover){border-color:var(--line2)}
.rowmain{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.rowmain .info em{color:var(--acc-t);font-style:normal;font-weight:700}
.thumb{width:56px;height:56px;border-radius:9px;flex:0 0 auto}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:13px;color:var(--mute)}
.info .clip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rowacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:var(--tint-warn-border);background:var(--tint-warn-bg)}
.pill.ok{color:var(--ok);border-color:var(--tint-ok-border);background:var(--tint-ok-bg)}
.pill.acc{color:var(--acc-t);border-color:var(--tint-acc-border);background:var(--tint-acc-bg)}
.pill.bad{color:var(--bad);border-color:var(--bad-border);background:rgba(240,103,107,.1)}
.link.sm{font-size:12.5px}
.row .hint{font-size:12.5px;color:var(--mute);display:block}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--ok)}
.dotu{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:0 0 auto}

/* Messages */
.thead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;flex:0 0 auto}
.thead .av{width:34px;height:34px}
.thead b{display:flex;align-items:center;gap:6px}
.thead span{font-size:13px;color:var(--mute)}
.safe{display:flex;gap:10px;align-items:flex-start;margin:12px 0;padding:11px 12px;border:1px solid var(--tint-ok-border);background:var(--tint-ok-bg);border-radius:12px;font-size:13.5px;color:var(--tint-ok-text)}
.safe svg{flex:0 0 auto;color:var(--ok);margin-top:2px}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:96px;max-width:760px}
.bub{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14.5px;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--on);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--s2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.65;font-size:11px;margin-top:2px}
.compose{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:25}
.compose input{flex:1;min-width:0}

.scrim{position:fixed;inset:0;background:rgba(3,3,4,.75);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shadow-lg)}
.sheet::before{content:"";position:sticky;top:10px;display:block;width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto;z-index:2}
.sheet.still{animation:none}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cover{aspect-ratio:16/9}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gal>div{flex:0 0 100%;scroll-snap-align:start;height:100%;position:relative;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;pointer-events:none;z-index:2}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .15s,width .15s}

.seg.wrap{display:flex;flex-wrap:wrap;gap:6px;background:none;border:0;padding:0;margin-top:8px}

.sb{padding:18px}
.sb h2{font-family:var(--disp);font-size:21px;line-height:1.25;letter-spacing:-.02em;font-weight:700;margin-top:6px}
.adid{font-size:12px;color:var(--mute);background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.big b{font-size:26px;font-weight:800;color:var(--acc-t)}
.fixed{font-size:12px;font-weight:700;color:var(--ok);background:var(--tint-ok-bg);border:1px solid var(--tint-ok-border);border-radius:999px;padding:2px 9px}
.tokline{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.metarow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--mute);margin-top:10px}
.metarow .dot{margin:0 2px;color:var(--line2)}
.sec-t{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-top:16px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.spec{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.spec span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.spec b{font-size:13.5px;font-weight:600}
.ratepills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ratepills .pill.ok{color:var(--ok);border-color:var(--tint-ok-border);background:var(--tint-ok-bg)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.big b{font-size:26px;font-weight:800;color:var(--acc-t);font-variant-numeric:tabular-nums}
.big span{color:var(--mute);font-size:14px}
.seller{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;transition:border-color .15s}
.seller:hover{border-color:var(--line2)}
.seller .chev{color:var(--mute)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:var(--s2);border:1px solid var(--line);border-radius:12px}
.statrow div{padding:10px;text-align:center;border-left:1px solid var(--line)}
.statrow div:first-child{border-left:0}
.statrow b{display:block;font-size:17px;font-weight:700}
.statrow span{font-size:11.5px;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.barrow{display:grid;grid-template-columns:70px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.barrow b{color:var(--text);font-size:12.5px;text-align:right}
.track{height:6px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.track .fill{height:100%;background:var(--acc);border-radius:999px}
.revs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.revrow{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--acc-t)}
.revrow span{color:var(--line2)}
.revrow p{margin-top:4px;color:var(--desc-text)}
.revrow small{color:var(--mute);font-size:11.5px;display:block}
.revrow em{color:var(--acc-t);font-style:normal;font-weight:700;font-size:11.5px;margin-left:4px}
.starpick{display:flex;gap:6px;margin:10px 0 16px}
.starpick button{font-size:30px;line-height:1;color:var(--line2);transition:color .12s,transform .12s}
.starpick button[aria-pressed="true"]{color:var(--acc)}
.starpick button:hover{transform:scale(1.12)}
.seller .av{width:34px;height:34px}
.seller b{display:flex;align-items:center;gap:6px;font-weight:600}
.seller span{font-size:13px;color:var(--mute)}
.desc{margin-top:14px;color:var(--desc-text)}
.deliv{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.deliv span{color:var(--mute)}
.trust{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border:1px solid var(--tint-ok-border);background:var(--tint-ok-bg);border-radius:12px;font-size:14px;color:var(--tint-ok-text)}
.trust svg{flex:0 0 auto;color:var(--ok);margin-top:2px}
.sec-t{font-weight:700;font-size:14px;margin:18px 0 8px}
dl.bd{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:2px 14px}
dl.bd div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
dl.bd div:last-child{border:0;font-weight:700;font-size:15px}
dl.bd dt{color:var(--mute)}
dl.bd div:last-child dt{color:var(--text)}
dd{font-variant-numeric:tabular-nums;text-align:right}
dd small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.btns{display:flex;gap:10px;margin-top:12px}
.btns .btn{flex:1}

/* Bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:flex-end;background:var(--nav-bg2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--mute);font-size:11.5px;font-weight:600;min-height:60px}
.bottom button[aria-current="page"]{color:var(--acc-t)}
.bottom .sellb .circ{width:50px;height:50px;border-radius:50%;background:var(--grad);color:var(--on);display:grid;place-items:center;margin-top:-22px;border:4px solid var(--bg);box-shadow:0 0 0 1px rgba(255,122,26,.3),0 10px 28px -6px rgba(255,122,26,.6)}
.bottom .sellb{color:var(--text)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--s2);border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}

@media(min-width:760px){
  body{padding-bottom:0}
  .bottom{display:none!important}
  .tabs{display:flex}
  main{padding-top:34px}
  .grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible}
  .scrim{align-items:center}
  .sheet{border-radius:16px;border-bottom:1px solid var(--line2)}
  .compose{position:sticky;bottom:16px;border:1px solid var(--line);border-radius:12px;max-width:760px;margin-top:12px}
  .msgs{padding-bottom:0}
  .toast{bottom:28px}
}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(9,1fr)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

  /* Seller profile */
  function realReviewsFor(name){return S.reviews.filter(r=>r.seller===name).sort((a,b)=>b.ts-a.ts);}
  function totalReviews(seller){return (seller.reviews||0)+realReviewsFor(seller.name).length;}
  function avgStars(seller,real){
    if(!real.length)return null;
    const base=seller.reviews>0?4.6*seller.reviews:0,sum=real.reduce((a,r)=>a+r.stars,0);
    return ((base+sum)/(seller.reviews+real.length)).toFixed(1);
  }
  function ratingBars(seller,real){
    const tot=totalReviews(seller);
    if(tot<3)return null;
    const h=hash(seller.name);
    return [['Satisfied',88+h%11],['Friendly',85+(h>>4)%13],['Reliable',87+(h>>8)%12]];
  }
  const REVIEW_LINES=['Item matched the listing exactly, smooth transaction.','Fast delivery and good communication throughout.','Escrow made this feel safe. Would buy again.','Product was as described, well packaged.','Responsive seller, resolved a small delay quickly.'];
  function simReviewsFor(seller){
    if(!seller.reviews)return [];
    const n=Math.min(3,seller.reviews),r=rng(hash(seller.name+'r'));
    const out=[];for(let i=0;i<n;i++)out.push({text:REVIEW_LINES[Math.floor(r()*REVIEW_LINES.length)],ts:Date.now()-Math.floor(r()*20)*H*6,stars:4+Math.round(r()),sim:true});
    return out;
  }

  const COLORS=[['Black','#1a1a1a'],['White','#f2f2f2'],['Grey','#8a8d93'],['Red','#c0392b'],['Blue','#2d6cdf'],['Brown','#7a5230']];

  function buy(id){
    const x=find(id);
    if(!x||x.status!=='active')return toast('This listing is no longer available.');
    if(!variantOk(x))return toast('Pick a size and color first.');
    const phys=PHYS(x.cat),ship=shipOf(x),totalU=x.price+ship,tok=S.payTok,amt=r6(toTok(tok,totalU));
    let addr='';
    if(phys){
      addr=($('#d-addr')?$('#d-addr').value:S.addr).trim();
      if(addr.length<8){const e=$('#buy-err');e.textContent='Enter your delivery address so the seller can ship.';e.hidden=false;return;}
      S.addr=addr;
    }
    if(!canPay(tok,amt))return toast('Insufficient balance.');
    S.bal[tok]=r6(S.bal[tok]-amt);S.bal.SOL=r6(S.bal.SOL-NET);x.status='sold';
    const tx=txid(),ts=Date.now(),variant=variantLine();
    S.orders.unshift({id:x.id,title:x.title,cat:x.cat,img:x.img||null,seller:x.seller.name,totalU,tok,amt,addr,variant,status:'escrow',tracking:null,dispute:null,tx,ts});
    S.ledger.unshift({type:'Purchase',title:x.title,tok,amount:-amt,tx,ts});
    creditReferralOnFirstPurchase(totalU);
    S.actTab='orders';save();renderWallet();go('profile');toast('Payment sent to escrow.');
    scheduleShip(tx);
  }
  function scheduleShip(tx){
    setTimeout(()=>{
      const o=S.orders.find(o=>o.tx===tx);
      if(o&&o.status==='escrow'){
        o.status='shipped';o.tracking='SM-'+tx.slice(0,8).toUpperCase();
        save();if(S.tab==='profile'&&S.actTab==='orders')viewProfile();
        toast('"'+o.title+'" has shipped.');
      }
    },5000);
  }

  /* Cart */
  function cartKey(id,size,color){return id+'|'+(size||'')+'|'+(color||'');}
  function addToCart(id){
    const x=find(id);if(!x||x.status!=='active')return toast('This listing is no longer available.');

    const key=cartKey(id,S.pick.size,S.pick.color),ex=S.cart.find(c=>c.key===key);
    if(ex)ex.qty++;else S.cart.push({key,id,title:x.title,cat:x.cat,price:x.price,ship:shipOf(x),img:x.imgs&&x.imgs[0]||x.img||null,size:S.pick.size,color:S.pick.color,qty:1,ts:Date.now()});

  }
  function cartLine(c){return [c.size?('Size '+c.size):'',c.color||''].filter(Boolean).join(' · ');}
  function cartSubtotal(){return r6(S.cart.reduce((n,c)=>n+c.price*c.qty,0));}
  function cartShip(){
    const seen=new Set();let t=0;
    S.cart.forEach(c=>{if(PHYS(c.cat)&&c.ship&&!seen.has(c.id)){t+=c.ship;seen.add(c.id);}});
    return r6(t);
  }
  function cartHasPhys(){return S.cart.some(c=>PHYS(c.cat));}
  function openCart(){

        '<div class="info"><b>'+esc(c.title)+'</b>'+(cartLine(c)?'<span class="clip">'+esc(cartLine(c))+'</span>':'')+'<span>'+usd(c.price)+' each</span></div>'+
        '<div class="acts"><div class="qty"><button data-cartdec="'+c.key+'" aria-label="Decrease quantity">−</button><b>'+c.qty+'</b><button data-cartinc="'+c.key+'" aria-label="Increase quantity">+</button></div>'+

      (S.cart.length?
        '<dl class="bd" style="margin-top:16px"><div><dt>Subtotal</dt><dd>'+usd(subtotal)+'</dd></div>'+
        (phys?'<div><dt>Delivery</dt><dd>'+(ship?usd(ship):'Free')+'</dd></div>':'')+

        (phys?'<p class="sec-t">Delivery address</p><div class="field" style="margin:0"><textarea id="c-addr" placeholder="Street, city and a phone number for the courier" style="min-height:70px">'+esc(S.addr)+'</textarea></div>':'')+
        (!ok&&S.cart.length?'<p class="err" style="margin:10px 0 0">You need '+tokStr(tok,amt)+'. Try the other token or add test funds in Profile.</p>':'')+
        '<div id="cart-err" class="err" style="margin:10px 0 0" hidden></div>'+

      :'')+
      '<div class="btns"><button class="btn sec wide" data-act="close">Continue shopping</button></div></div></div>');
  }
  function cartInc(key){const c=S.cart.find(c=>c.key===key);if(c)c.qty++;save();openCart();}
  function cartDec(key){const c=S.cart.find(c=>c.key===key);if(c){c.qty--;if(c.qty<=0)S.cart=S.cart.filter(c=>c.key!==key);}save();renderCartBtn();openCart();}
  function cartRemove(key){S.cart=S.cart.filter(c=>c.key!==key);save();renderCartBtn();openCart();}
  function cartCheckout(){
    if(!S.cart.length)return;
    const subtotal=cartSubtotal(),ship=cartShip(),totalU=r6(subtotal+ship),tok=S.payTok,amt=r6(toTok(tok,totalU)),phys=cartHasPhys();
    let addr='';
    if(phys){
      addr=($('#c-addr')?$('#c-addr').value:S.addr).trim();
      if(addr.length<8){const e=$('#cart-err');e.textContent='Enter your delivery address so sellers can ship.';e.hidden=false;return;}
      S.addr=addr;
    }
    if(!canPay(tok,amt))return toast('Insufficient balance.');
    S.bal[tok]=r6(S.bal[tok]-amt);S.bal.SOL=r6(S.bal.SOL-NET);
    const ts=Date.now();
    S.cart.forEach(c=>{
      const x=find(c.id);if(x&&x.status==='active')x.status='sold';
      const itemU=r6(c.price*c.qty),itemAmt=r6(toTok(tok,itemU)),tx=txid();

      S.ledger.unshift({type:'Purchase',title:c.title,tok,amount:-itemAmt,tx,ts});
      scheduleShip(tx);
    });
    creditReferralOnFirstPurchase(totalU);

  function readImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=720,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

  function saleActs(sa){
    if(sa.status==='paid')return '<span class="pill warn">Paid, awaiting shipment</span><button class="btn sm" data-shipform="'+sa.tx+'">Mark as shipped</button>';
    if(sa.status==='shipped')return '<span class="pill acc">Shipped</span><span class="hint mono">'+esc(sa.tracking)+'</span><div class="rowacts"><button class="btn sm" data-buyerok="'+sa.tx+'">Buyer confirms delivery</button><button class="btn sec sm" data-buyerbad="'+sa.tx+'">Buyer reports an issue</button></div>';
    if(sa.status==='disputed')return '<span class="pill bad">Disputed</span><span class="hint">'+esc((sa.dispute&&sa.dispute.desc)||'')+'</span><button class="btn sm" data-resolve="'+sa.tx+'">Resolve, release funds to me</button>';
    return '<span class="pill ok">Paid out</span><span>'+tokStr(sa.pt,sa.amt)+'</span>';
  }
  function profileList(){
    let h='';
    if(S.actTab==='orders'){
      h=S.orders.length?S.orders.map(o=>
        '<div class="row"><button class="rowmain" data-sellerview="'+esc(o.seller)+'" aria-label="View '+esc(o.seller)+'\u2019s seller profile"><div class="thumb">'+(o.img?'<img src="'+o.img+'" alt="">':artSVG(o.id)+glyph(o.cat))+'</div>'+
        '<div class="info"><b>'+esc(o.title)+'</b>'+(o.variant?'<span class="clip">'+esc(o.variant)+'</span>':'')+'<span class="clip">Paid '+tokStr(o.tok,o.amt)+' ('+usd(o.totalU)+') to <em>'+esc(o.seller)+'</em></span>'+(o.addr?'<span class="clip">Delivering to '+esc(o.addr)+'</span>':'')+'<span class="mono">'+stx(o.tx)+'</span></div></button>'+
        '<div class="acts">'+orderActs(o)+'</div></div>'
      ).join(''):'<div class="empty"><b>No orders yet</b>Items you buy are held in escrow here until you confirm delivery.<br><button class="btn sec sm" data-tab="home">Browse listings</button></div>';
    }else if(S.actTab==='ads'){
      const mine=S.listings.filter(x=>x.owner&&x.owner===S.wallet);
      h=mine.length?mine.map(x=>
        '<div class="row"><div class="thumb">'+cover(x)+'</div><div class="info"><b>'+esc(x.title)+'</b><span>'+usd(x.price)+', '+esc(x.cat)+'</span></div>'+
        '<div class="acts">'+(x.status==='active'?'<span class="pill acc">Active</span><div class="rowacts"><button class="btn sec sm" data-testsale="'+x.id+'">Test sale</button><button class="btn sec sm" data-dup="'+x.id+'">Duplicate</button><button class="btn bad sm" data-remove="'+x.id+'">Remove</button></div>':'<span class="pill ok">Sold</span><button class="btn sec sm" data-dup="'+x.id+'">Duplicate</button>')+'</div></div>'
      ).join('')+'<p class="note">Test sale simulates a buyer paying for your listing, then walks through shipping just like a real order. Duplicate pre-fills the Sell form so you can list similar items fast.</p>'
      :'<div class="empty"><b>No listings yet</b>Publish your first listing to start selling.<br><button class="btn sec sm" data-tab="sell">Post a listing</button></div>';
    }else if(S.actTab==='sales'){
      h=S.sales.length?S.sales.map(sa=>
        '<div class="row"><div class="thumb">'+(sa.img?'<img src="'+sa.img+'" alt="">':artSVG(sa.id)+glyph(sa.cat))+'</div>'+
        '<div class="info"><b>'+esc(sa.title)+'</b><span>'+tokStr(sa.pt,sa.amt)+' · Buyer: '+esc(sa.buyer)+'</span><span class="mono">'+stx(sa.tx)+'</span></div>'+
        '<div class="acts">'+saleActs(sa)+'</div></div>'
      ).join('')+'<p class="note">Since this is a single-account demo, you confirm the buyer\u2019s steps yourself to see the full lifecycle.</p>'
      :'<div class="empty"><b>No sales yet</b>Use Test sale on an active listing to walk through shipping and delivery.</div>';
    }else{
      const ld=S.ledgerView||'all';
      const entries=S.ledger.filter(e=>ld==='payouts'?e.amount>0:ld==='purchases'?e.amount<0:true);
      h='<div class="seg" role="group" aria-label="Ledger view" style="margin-bottom:12px">'+[['all','All'],['payouts','Payouts'],['purchases','Purchases']].map(o=>'<button data-ledgerview="'+o[0]+'" aria-pressed="'+(ld===o[0])+'">'+o[1]+'</button>').join('')+'</div>'+
      (entries.length?entries.map(e=>
        '<div class="row"><div class="info"><b>'+esc(e.type)+', '+esc(e.title)+'</b><span>'+ago(e.ts)+'</span> <button class="link mono" data-copy="'+e.tx+'" aria-label="Copy transaction ID">'+stx(e.tx)+'</button></div>'+
        '<div class="amt'+(e.amount>0?' pos':'')+'">'+(e.amount===0?'None':(e.amount>0?'+':'-')+tokStr(e.tok,Math.abs(e.amount)))+'</div></div>'
      ).join(''):'<div class="empty"><b>Nothing here yet</b>Every payment, payout and escrow event is recorded with a transaction ID.</div>');
    }
    return h;
  }

  function render(){
    const nk=S.tab==='login'?(S.after||'profile'):S.tab;
    document.querySelectorAll('nav [data-tab]').forEach(b=>{if(b.dataset.tab===nk)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    ({home:viewHome,favs:viewFavs,sell:viewSell,messages:viewMessages,profile:viewProfile,login:viewLogin}[S.tab]||viewHome)();
    if(!(S.tab==='messages'&&S.thread!==null))window.scrollTo(0,0);
    updateBadge();renderCartBtn();
  }

  /* Events */
  document.addEventListener('click',e=>{
    if(e.target.id==='scrim')return closeLayer();
    const t=e.target.closest('button,a[data-tab]');if(!t)return;
    if(t.tagName==='A')e.preventDefault();
    const d=t.dataset;
    if(d.act){
      switch(d.act){
        case 'login':S.after=null;S.tab='login';return render();
        case 'signin-buy':return needLogin('home');
        case 'close':return closeLayer();
        case 'back':S.thread=null;return render();
        case 'send':return sendMsg();
        case 'toggle-auth':S.authMode=S.authMode==='login'?'register':'login';return viewLogin();
        case 'forgot':return toast('Password reset is not available in the demo.');
        case 'email-auth':return authEmail();
        case 'signout':return signOut();
        case 'faucet':S.bal.SOL=r6(S.bal.SOL+5);S.bal.USDC=r6(S.bal.USDC+200);save();renderWallet();viewProfile();return toast('Added ◎ 5 and 200 USDC test funds.');
        case 'copyaddr':try{navigator.clipboard.writeText(S.wallet).then(()=>toast('Address copied.'),()=>toast('Copy is not available here.'));}catch(err){toast('Copy is not available here.');}return;
        case 'publish':return publish();
        case 'save-seller':return saveSellerProfile();
        case 'submit-review':return submitReview(t.dataset.tx);
        case 'edit-seller':return viewSellerSetup(true);
        case 'verify-seller':return requestVerification();
        case 'toggle-theme':S.theme=S.theme==='light'?'dark':'light';applyTheme();save();return;
        case 'open-cart':return openCart();
        case 'cart-checkout':return cartCheckout();
        case 'open-filters':return openFilters();
        case 'apply-filters':return applyFilters();
        case 'clear-filters':return clearFilters();
        case 'submit-dispute':return submitDispute(t.dataset.tx);
        case 'submit-ship':return submitShip(t.dataset.tx);
        case 'print-receipt':window.print();return;
        case 'copyref':{const code=genRefCode();try{navigator.clipboard.writeText(code).then(()=>toast('Referral code copied.'),()=>toast('Copy is not available here.'));}catch(err){toast('Copy is not available here.');}return;}
        case 'shareref':{const code=genRefCode(),link='https://solmart.app/join?ref='+code;try{navigator.clipboard.writeText(link).then(()=>toast('Invite link copied.'),()=>toast('Copy is not available here.'));}catch(err){toast('Copy is not available here.');}return;}
      }
      return;
    }
    if(d.auth)return d.auth==='phantom'?authPhantom():authDemo();
    if(d.tab)return go(d.tab);
    if(d.fav)return toggleFav(+d.fav);
    if(d.open)return openProduct(+d.open);
    if(d.sellerview)return openSellerProfile(d.sellerview);
    if(d.review)return openReviewForm(d.review);
    if(d.addcart)return addToCart(+d.addcart);
    if(d.cartinc)return cartInc(d.cartinc);
    if(d.cartdec)return cartDec(d.cartdec);
    if(d.cartremove)return cartRemove(d.cartremove);
    if(d.rmimg!==undefined){S.draftImgs.splice(+d.rmimg,1);return renderThumbrow();}
    if(d.cond){S.filters.cond=d.cond;document.querySelectorAll('[data-cond]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cond===d.cond));return;}
    if(d.size){S.pick.size=S.pick.size===d.size?null:d.size;return openProduct(+d.pid,true);}
    if(d.color){S.pick.color=S.pick.color===d.color?null:d.color;return openProduct(+d.pid,true);}
    if(d.star){
      S.draftStars=+d.star;
      document.querySelectorAll('#starpick button').forEach(b=>{const on=+b.dataset.star<=S.draftStars;b.textContent=on?'★':'☆';b.setAttribute('aria-pressed',on);});
      return;
    }
    if(d.pay){if(d.pid==='cart'){S.payTok=d.pay;return openCart();}S.payTok=d.pay;return openProduct(+d.pid,true);}
    if(d.buy)return buy(+d.buy);
    if(d.msg)return S.wallet?openThread(+d.msg):needLogin('messages');
    if(d.thread){S.thread=+d.thread;return render();}
    if(d.cat){S.cat=(S.cat===d.cat)?'All':d.cat;document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===S.cat));return renderGrid();}
    if(d.seg){S.actTab=d.seg;return viewProfile();}
    if(d.release){
      const o=S.orders.find(o=>o.tx===d.release);
      if(o&&(o.status==='shipped'||o.status==='escrow')){o.status='delivered';S.ledger.unshift({type:'Escrow released',title:o.title,tok:o.tok,amount:0,tx:txid(),ts:Date.now()});save();viewProfile();toast('Delivery confirmed. Funds released to the seller.');}
      return;
    }
    if(d.dispute)return openDisputeForm(d.dispute);
    if(d.withdraw){
      const o=S.orders.find(o=>o.tx===d.withdraw);
      if(o&&o.status==='disputed'){o.status='shipped';o.dispute=null;S.ledger.unshift({type:'Dispute withdrawn',title:o.title,tok:o.tok,amount:0,tx:txid(),ts:Date.now()});save();viewProfile();toast('Dispute withdrawn.');}
      return;
    }
    if(d.receipt)return openReceipt(d.receipt);
    if(d.dup)return duplicateListing(+d.dup);
    if(d.shipform)return openShipForm(d.shipform);
    if(d.buyerok){
      const sa=S.sales.find(s=>s.tx===d.buyerok);
      if(sa&&sa.status==='shipped'){sa.status='delivered';S.bal[sa.pt]=r6(S.bal[sa.pt]+sa.amt);S.ledger.unshift({type:'Sale',title:sa.title,tok:sa.pt,amount:sa.amt,tx:txid(),ts:Date.now()});save();renderWallet();viewProfile();toast('Buyer confirmed delivery. '+tokStr(sa.pt,sa.amt)+' released to you.');}
      return;
    }
    if(d.buyerbad){
      const sa=S.sales.find(s=>s.tx===d.buyerbad);
      if(sa&&sa.status==='shipped'){sa.status='disputed';sa.dispute={desc:'Buyer says the item never arrived.',ts:Date.now()};S.ledger.unshift({type:'Dispute opened',title:sa.title,tok:sa.pt,amount:0,tx:txid(),ts:Date.now()});save();viewProfile();toast('Simulated buyer dispute opened.');}
      return;
    }
    if(d.resolve){
      const sa=S.sales.find(s=>s.tx===d.resolve);
      if(sa&&sa.status==='disputed'){sa.status='delivered';S.bal[sa.pt]=r6(S.bal[sa.pt]+sa.amt);S.ledger.unshift({type:'Sale',title:sa.title,tok:sa.pt,amount:sa.amt,tx:txid(),ts:Date.now()});save();renderWallet();viewProfile();toast('Dispute resolved. '+tokStr(sa.pt,sa.amt)+' released to you.');}
      return;
    }
    if(d.remove){S.listings=S.listings.filter(l=>l.id!==+d.remove);save();viewProfile();return toast('Listing removed.');}
    if(d.testsale){
      const x=find(+d.testsale);
      if(x&&x.status==='active'){
        x.status='sold';
        const pt=x.payout||'USDC',netU=x.price*(1-FEE)+shipOf(x),amt=r6(toTok(pt,netU)),tx=txid();
        S.sales.unshift({id:x.id,title:x.title,cat:x.cat,img:x.img||null,pt,amt,buyer:'Test buyer',status:'paid',tracking:null,dispute:null,tx,ts:Date.now()});
        save();S.actTab='sales';viewProfile();toast('Test sale started. Mark it as shipped when ready.');
      }
      return;
    }
    if(d.ledgerview){S.ledgerView=d.ledgerview;return viewProfile();}
    if(d.copy){try{navigator.clipboard.writeText(d.copy).then(()=>toast('Transaction ID copied.'),()=>toast('Copy is not available here.'));}catch(err){toast('Copy is not available here.');}}
  });
  document.addEventListener('input',e=>{
    const id=e.target.id;
    if(id==='search'){S.q=e.target.value;renderGrid();}
    if(id==='f-price'||id==='f-ship')updateRecv();
    if(id==='d-addr')S.addr=e.target.value;
    if(id==='a-ref')S.refInput=e.target.value;
  });
  document.addEventListener('change',async e=>{
    const id=e.target.id;
    if(id==='sort'){S.sort=e.target.value;renderGrid();}
    if(id==='f-cat')togglePhys();
    if(id==='f-pay')updateRecv();
    if(id==='f-img'&&e.target.files.length){
      await handleImgUpload(e.target.files);
      e.target.value='';
    }
  });
  document.addEventListener('scroll',e=>{
    const g=e.target;if(!g.classList||!g.classList.contains('gal'))return;
    const i=Math.round(g.scrollLeft/g.clientWidth);
    const dots=g.parentElement.querySelectorAll('.dots span');
    dots.forEach((d,n)=>d.classList.toggle('on',n===i));
  },true);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeLayer();
    if(e.key==='Enter'&&e.target.id==='msg-input'){e.preventDefault();sendMsg();}
    if(e.key==='Enter'&&(e.target.id==='a-pass'||e.target.id==='a-email')){e.preventDefault();authEmail();}
  });

  applyTheme();
  load().then(()=>{applyTheme();renderWallet();renderCartBtn();render();initSupabase();});
})();
</script>
</body>
</html>
